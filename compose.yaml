name: racecar-sim

services:
  algorithm:
    build:
      context: ./docker
      dockerfile: Dockerfile.algorithm
      args:
        USERNAME: developer
        USER_UID: "${LOCAL_UID:-1000}"
        USER_GID: "${LOCAL_GID:-1000}"
    image: racecar-algorithm:jazzy-noble
    container_name: racecar-algorithm

    # Host networking lets ROS 2 DDS discovery work between both containers
    # without maintaining a middleware-specific port list.
    network_mode: host
    ipc: host
    init: true

    environment:
      CODEX_HOME: /.codex
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: "${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"

    volumes:
      - ${HOME}/.codex:/.codex
      - .:/racecar_sim
      - ./ros2_ws:/ws
      - ./data:/data:ro

    working_dir: /ws
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  simulation:
    build:
      context: ./docker
      dockerfile: Dockerfile.simulation
      args:
        USERNAME: developer
        USER_UID: "${LOCAL_UID:-1000}"
        USER_GID: "${LOCAL_GID:-1000}"
    image: racecar-simulation:jazzy-noble
    container_name: racecar-simulation

    network_mode: host
    ipc: host
    init: true

    environment:
      CODEX_HOME: /.codex
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: "${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      DISPLAY: "${DISPLAY:-:0}"
      XDG_RUNTIME_DIR: /tmp/runtime-developer
      QT_X11_NO_MITSHM: "1"
      # NVIDIA Container Toolkit injects the host driver and GL/Vulkan libs.
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-graphics,utility,display}"
      # PRIME Render Offload selects the discrete NVIDIA GPU on hybrid laptops.
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __VK_LAYER_NV_optimus: NVIDIA_only
      # Set to 1 only as an emergency software-rendering fallback.
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-0}"

    # Requires Docker Compose 2.30+ and NVIDIA Container Toolkit on the host.
    gpus: all

    # Keep the DRM nodes available for PRIME synchronization on hybrid GPUs.
    # Numeric defaults match Ubuntu; override if host group IDs differ.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-990}"

    volumes:
      - ${HOME}/.codex:/.codex
      - .:/racecar_sim
      - ./simulation_ws:/simulation_ws
      # Keep the algorithm workspace at the same absolute path in both
      # containers.  colcon --symlink-install creates links containing /ws.
      - ./ros2_ws:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    working_dir: /simulation_ws
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
